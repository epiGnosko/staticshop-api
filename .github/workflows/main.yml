name: Dependency Caching Task

on: [push]

jobs:
  cache-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache dependencies
        id: my-cache-step
        uses: actions/cache@v4
        with:
          # This is where your 'dependencies' would normally live
          path: ~/.npm
          # This is the specific key required by your assignment
          key: cache-77186c6

      - name: prime-cache-77186c6
        run: echo "Cache hit status is ${{ steps.my-cache-step.outputs.cache-hit }}"
